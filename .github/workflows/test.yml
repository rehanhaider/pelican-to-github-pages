name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck
        run: shellcheck entrypoint.sh tests/run.sh
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the image and check what it publishes
        run: tests/run.sh
