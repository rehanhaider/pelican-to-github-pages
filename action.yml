# action.yml
name: 'Pelican to Github Pages'
description: 'Generate the Pelican output and deploy to Github Pages'

branding:
  icon: 'home'
  color: 'red'

runs:
  using: 'docker'
  image: 'Dockerfile'

# Each input can also be set as an `env:` variable of the same name, which wins.
inputs:
  GH_PAGES_BRANCH:
    description: 'branch the built site is published to; must not be the branch the workflow runs on'
    required: false
    default: 'gh-pages'
  GH_PAGES_CNAME:
    description: 'custom domain written to the CNAME file, e.g. `example.com`; leave unset for a `*.github.io` site'
    required: false
    default: none
  PELICAN_CONFIG_FILE:
    description: 'Pelican settings file, `publishconf.py` by default'
    required: false
    default: publishconf.py
  PELICAN_CONTENT_FOLDER:
    description: 'override the default `content` content folder'
    required: false
    default: content
  PELICAN_THEME_FOLDER:
    description: 'folder with a package.json where `npm install` runs before the build, if your theme needs node modules'
    required: false
